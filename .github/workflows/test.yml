name: Test
on:
  pull_request:
  push:
    branches: [master, prod, stage]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.2'
          python-version: '3.13.7'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check stats_pipeline deploy/provision_aws.py tools/monthlyusers.py tools/tools.py tools/globaladdons.py tools/scalars.py tools/platlang.py tools/sumo.py


name: Deploy static website
on:
  push:
    branches: [prod, stage]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: (github.ref_name == 'prod' || github.ref_name == 'stage') && vars.STATS_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/publish-static.yml
    with:
      environment: ${{ github.ref_name == 'stage' && 'staging' || 'production' }}
      website_ref: ${{ github.ref_name }}
    secrets: inherit

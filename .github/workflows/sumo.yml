name: Collect SUMO
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  policy:
    uses: ./.github/workflows/collection-policy.yml
  collect:
    needs: policy
    if: needs.policy.outputs.allowed == 'true'
    uses: ./.github/workflows/collect-component.yml
    with:
      component: sumo
    secrets: inherit
  publish:
    needs: [policy, collect]
    if: always() && !cancelled() && needs.policy.outputs.allowed == 'true'
    uses: ./.github/workflows/publish-static.yml
    with:
      environment: production
      website_ref: prod
    secrets: inherit

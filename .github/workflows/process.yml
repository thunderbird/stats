name: Process statistics
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: 'Optional inclusive backfill start (YYYY-MM-DD)'
        type: string
      through:
        description: 'Last completed UTC day (default yesterday)'
        type: string
      namespace:
        description: 'Use shadow for validation without ATN handoff or publication'
        type: choice
        options: [prod, shadow]
        default: shadow
      verify_access:
        description: 'Also verify legacy telemetry reads and the Glean API key'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  daily:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.STATS_SCHEDULE_ENABLED == 'true')
    uses: ./.github/workflows/collect-component.yml
    with:
      component: daily
      namespace: ${{ inputs.namespace || 'prod' }}
      start: ${{ inputs.start || '' }}
      through: ${{ inputs.through || '' }}
    secrets: inherit
  weekly:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.STATS_SCHEDULE_ENABLED == 'true')
    strategy:
      fail-fast: false
      matrix:
        component: [addons, scalars, platforms, locales]
    uses: ./.github/workflows/collect-component.yml
    with:
      component: ${{ matrix.component }}
      namespace: ${{ inputs.namespace || 'prod' }}
      through: ${{ inputs.through || '' }}
    secrets: inherit
  mau:
    needs: daily
    if: always() && !cancelled() && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.STATS_SCHEDULE_ENABLED == 'true')
    uses: ./.github/workflows/collect-component.yml
    with:
      component: mau
      namespace: ${{ inputs.namespace || 'prod' }}
      through: ${{ inputs.through || '' }}
      verify_access: ${{ inputs.verify_access || false }}
    secrets: inherit
  publish-daily:
    needs: daily
    if: always() && !cancelled() && (inputs.namespace || 'prod') == 'prod' && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.STATS_SCHEDULE_ENABLED == 'true')
    uses: ./.github/workflows/publish-static.yml
    with:
      environment: production
      website_ref: prod
    secrets: inherit
  publish-weekly:
    needs: [weekly, mau]
    if: always() && !cancelled() && (inputs.namespace || 'prod') == 'prod' && github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || vars.STATS_SCHEDULE_ENABLED == 'true')
    uses: ./.github/workflows/publish-static.yml
    with:
      environment: production
      website_ref: prod
    secrets: inherit

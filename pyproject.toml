[project]
name = "thunderbird-stats"
version = "1.0.0"
description = "Thunderbird statistics collection and static publication"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.40,<2", "requests>=2.33,<3", "python-dateutil>=2.9,<3", "PyAthena>=3.0,<4"]

[project.optional-dependencies]
atn = ["docker>=7,<8"]

[project.scripts]
tb-stats = "stats_pipeline.cli:main"
tb-stats-atn = "stats_pipeline.atn:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stats_pipeline", "tools"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/test_monthlyusers.py"]
pythonpath = [".", "tools"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["tools/glean", "tools/weekday.py", "tools/weekping.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
